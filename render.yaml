services:
  # Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: risk-capital
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: risk-capital-db
          property: connectionString

databases:
  # PostgreSQL Database Instance
  - name: risk-capital-db
    plan: free
    databaseName: risk_capital
    user: postgres
